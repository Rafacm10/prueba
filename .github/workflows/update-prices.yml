name: Buscar productos y actualizar precios
on:
  workflow_dispatch:
  schedule:
    # GitHub Actions se ejecuta en servidores; el ordenador del usuario no necesita estar encendido.
    - cron: '23 */6 * * *'
  push:
    paths:
      - 'scripts/update-prices.mjs'
      - '.github/workflows/update-prices.yml'
permissions:
  contents: write
concurrency:
  group: buscador-de-cremas-price-refresh
  cancel-in-progress: false
jobs:
  discover-and-update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Descubrir productos y leer precios públicos
        run: node scripts/update-prices.mjs
      - name: Guardar catálogo y precios actualizados
        run: |
          if ! git diff --quiet -- data/products.json data/prices.json data/update-status.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add data/products.json data/prices.json data/update-status.json
            git commit -m 'Descubrir productos y actualizar precios automáticamente'
            git push
          else
            echo 'No hay cambios en los datos.'
          fi
